name: Build

concurrency:
  group: "build"
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main
    paths-ignore:
      - '*.md'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          path: "src"

      - name: Checkout Builds Branch
        uses: actions/checkout@v4
        with:
          ref: "builds"
          path: "builds"

      - name: Clean Old Builds
        run: |
          rm -f $GITHUB_WORKSPACE/builds/*.cs3 || true
          rm -f $GITHUB_WORKSPACE/builds/*.json || true

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: 17

      - name: Access Secrets
        env:
          TMDB_API: ${{ secrets.TMDB_API || '4596409115e114cbf0cde970e3c1bb96' }}
          DUMP_API: ${{ secrets.DUMP_API || 'none' }}
          DUMP_KEY: ${{ secrets.DUMP_KEY || 'none' }}
          CRUNCHYROLL_BASIC_TOKEN: ${{ secrets.CRUNCHYROLL_BASIC_TOKEN || 'none' }}
          CRUNCHYROLL_REFRESH_TOKEN: ${{ secrets.CRUNCHYROLL_REFRESH_TOKEN || 'none' }}
          ANICHI_API: ${{ secrets.ANICHI_API || 'none' }}
          ANICHI_SERVER: ${{ secrets.ANICHI_SERVER || 'none' }}
          ANICHI_ENDPOINT: ${{ secrets.ANICHI_ENDPOINT || 'none' }}
          ANICHI_APP: ${{ secrets.ANICHI_APP || 'none' }}
          ZSHOW_API: ${{ secrets.ZSHOW_API || 'none' }}
          SFMOVIES_API: ${{ secrets.SFMOVIES_API || 'none' }}
          CINEMATV_API: ${{ secrets.CINEMATV_API || 'none' }}
          GHOSTX_API: ${{ secrets.GHOSTX_API || 'none' }}
          SUPERSTREAM_FIRST_API: ${{ secrets.SUPERSTREAM_FIRST_API || 'none' }}
          SUPERSTREAM_SECOND_API: ${{ secrets.SUPERSTREAM_SECOND_API || 'none' }}
          SUPERSTREAM_THIRD_API: ${{ secrets.SUPERSTREAM_THIRD_API || 'none' }}
          SUPERSTREAM_FOURTH_API: ${{ secrets.SUPERSTREAM_FOURTH_API || 'none' }}
        run: |
          cd $GITHUB_WORKSPACE/src
          touch local.properties
          echo "TMDB_API=$TMDB_API" >> local.properties
          echo "DUMP_API=$DUMP_API" >> local.properties
          echo "DUMP_KEY=$DUMP_KEY" >> local.properties
          echo "CRUNCHYROLL_BASIC_TOKEN=$CRUNCHYROLL_BASIC_TOKEN" >> local.properties
          echo "CRUNCHYROLL_REFRESH_TOKEN=$CRUNCHYROLL_REFRESH_TOKEN" >> local.properties
          echo "ANICHI_API=$ANICHI_API" >> local.properties
          echo "ANICHI_SERVER=$ANICHI_SERVER" >> local.properties
          echo "ANICHI_ENDPOINT=$ANICHI_ENDPOINT" >> local.properties
          echo "ANICHI_APP=$ANICHI_APP" >> local.properties
          echo "ZSHOW_API=$ZSHOW_API" >> local.properties
          echo "SFMOVIES_API=$SFMOVIES_API" >> local.properties
          echo "CINEMATV_API=$CINEMATV_API" >> local.properties
          echo "GHOSTX_API=$GHOSTX_API" >> local.properties
          echo "SUPERSTREAM_FIRST_API=$SUPERSTREAM_FIRST_API" >> local.properties
          echo "SUPERSTREAM_SECOND_API=$SUPERSTREAM_SECOND_API" >> local.properties
          echo "SUPERSTREAM_THIRD_API=$SUPERSTREAM_THIRD_API" >> local.properties
          echo "SUPERSTREAM_FOURTH_API=$SUPERSTREAM_FOURTH_API" >> local.properties

      - name: Build Plugins
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          cd $GITHUB_WORKSPACE/src
          chmod +x gradlew
          ./gradlew make makePluginsJson --no-daemon --stacktrace
          cp -r **/build/*.cs3 $GITHUB_WORKSPACE/builds/ || true
          cp build/plugins.json $GITHUB_WORKSPACE/builds/plugins.json || true
          cp build/repo.json $GITHUB_WORKSPACE/builds/repo.json || true

      - name: Push Builds
        run: |
          cd $GITHUB_WORKSPACE/builds
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add .
          git commit -m "Build $GITHUB_SHA" || exit 0
          git push --force origin builds